# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cost_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d cost_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      COST_TEST_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/cost_test
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements/validation.lock
      - run: python -m pip install --disable-pip-version-check pip==26.2
      - name: Install exact development dependencies
        run: |
          python -m pip install --require-hashes --report validation-install.json -r requirements/validation.lock
          python -m pip install --disable-pip-version-check -e '.[test]'
          python -m pip check
      - name: Verify source and typing
        run: |
          ruff format --check .
          ruff check .
          mypy src
      - name: Verify released contracts
        run: python scripts/verify_contracts.py
      - name: Run unit, integration, and conformance tests
        run: pytest --junitxml=test-results.xml
      - name: Preserve compatibility results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cost-usage-compatibility-python-${{ matrix.python }}
          path: |
            test-results.xml
            validation-install.json
            requirements/validation.lock

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/validation.lock
      - run: python -m pip install --disable-pip-version-check pip==26.2
      - run: |
          python -m pip install --require-hashes --report validation-install.json -r requirements/validation.lock
          python -m pip install --disable-pip-version-check -e '.[test]'
          python -m pip check
      - run: bandit -r src -c pyproject.toml
      - run: pip-audit --skip-editable

  package:
    name: Package
    needs: [test, security]
    runs-on: ubuntu-latest
    env:
      SOURCE_DATE_EPOCH: "1787702400"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/validation.lock
      - run: python -m pip install --disable-pip-version-check pip==26.2
      - run: |
          python -m pip install --require-hashes --report validation-install.json -r requirements/validation.lock
          python -m pip install --disable-pip-version-check -e '.[test]'
          python -m pip check
      - name: Build twice
        run: |
          python -m build --no-isolation --outdir dist-a
          python -m build --no-isolation --outdir dist-b
      - name: Verify deterministic distributions
        run: |
          twine check dist-a/*
          python scripts/verify_artifacts.py dist-a --output dist-a/artifact-report.json
          python scripts/compare_artifacts.py dist-a dist-b
          python scripts/verify_contracts.py --output dist-a/conformance-report.json
      - name: Generate dependency SBOM
        run: >-
          cyclonedx-py environment
          --pyproject pyproject.toml
          --mc-type library
          --output-reproducible
          --spec-version 1.6
          --output-format JSON
          --output-file dist-a/sbom.cdx.json
      - name: Verify dependency SBOM
        run: python scripts/verify_sbom.py dist-a/sbom.cdx.json
      - name: Smoke-install built wheel
        run: |
          python -m venv wheel-smoke
          wheel-smoke/bin/python -m pip install --disable-pip-version-check --report dist-a/clean-install.json dist-a/*.whl
          wheel-smoke/bin/python -m pip check
          wheel-smoke/bin/python -m pip freeze > dist-a/clean-install.lock
          wheel-smoke/bin/python -c 'import meridian_storage.plugins.cost as cost; assert cost.__version__ == "2.0.1"'
      - name: Create checksum ledger
        working-directory: dist-a
        run: sha256sum meridian_plugin_cost-* artifact-report.json conformance-report.json sbom.cdx.json clean-install.json clean-install.lock > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: meridian-plugin-cost-2.0.1
          path: dist-a/
          if-no-files-found: error
          retention-days: 30
