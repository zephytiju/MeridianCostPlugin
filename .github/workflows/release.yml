# SPDX-License-Identifier: Apache-2.0
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable release tag to recover
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  SOURCE_DATE_EPOCH: "1787702400"

jobs:
  build:
    name: Build release
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cost_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d cost_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      COST_TEST_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/cost_test
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid tag" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Resolve immutable source commit
        id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --disable-pip-version-check pip==26.2
      - run: python -m pip install --disable-pip-version-check -e '.[test]'
      - name: Verify release source
        run: |
          ruff format --check .
          ruff check .
          mypy src
          pytest --junitxml=compatibility-tests.xml
      - name: Build and verify distributions
        run: |
          python -m build --no-isolation --outdir dist
          twine check dist/*
          python scripts/verify_artifacts.py dist --output dist/artifact-report.json
          python scripts/verify_contracts.py --output dist/conformance-report.json
      - name: Verify clean candidate installation
        run: |
          python -m venv wheel-smoke
          wheel-smoke/bin/python -m pip install --report dist/clean-install.json dist/*.whl
          wheel-smoke/bin/python -m pip check
          wheel-smoke/bin/python -m pip freeze > dist/clean-install.lock
          cp compatibility-tests.xml dist/
      - name: Generate dependency SBOM
        run: >-
          cyclonedx-py environment
          --pyproject pyproject.toml
          --mc-type library
          --output-reproducible
          --spec-version 1.6
          --output-format JSON
          --output-file dist/sbom.cdx.json
      - name: Add deterministic CycloneDX serial number
        env:
          SBOM_NAMESPACE: ${{ github.repository }}@${{ env.RELEASE_TAG }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import uuid

          path = pathlib.Path("dist/sbom.cdx.json")
          document = json.loads(path.read_text(encoding="utf-8"))
          payload = json.dumps(document, sort_keys=True, separators=(",", ":")).encode()
          identity = f"{os.environ['SBOM_NAMESPACE']}#{hashlib.sha256(payload).hexdigest()}"
          document["serialNumber"] = f"urn:uuid:{uuid.uuid5(uuid.NAMESPACE_URL, identity)}"
          path.write_text(
              json.dumps(document, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Verify dependency SBOM
        run: python scripts/verify_sbom.py dist/sbom.cdx.json
      - name: Create release evidence ledger
        run: >-
          python scripts/create_release_evidence.py dist
          --source-commit "${{ steps.source.outputs.commit }}"
          --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-distributions
          path: dist/
          if-no-files-found: error

  attest:
    name: Attest release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions
          path: dist
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "dist/*"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "dist/meridian_plugin_cost-*"
          sbom-path: "dist/sbom.cdx.json"

  github-release:
    name: Publish GitHub release
    needs: [build, attest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions
          path: dist
      - name: Publish immutable tag artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          fi

  pypi:
    name: Publish PyPI
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [build, attest]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/meridian-plugin-cost
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions
          path: dist
      - name: Select distributions
        run: |
          mkdir -p publish
          cp dist/*.whl dist/*.tar.gz publish/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: publish/
          skip-existing: true

  verify-published:
    name: Verify published PyPI package
    needs: pypi
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cost_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d cost_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      COST_TEST_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/cost_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install published runtime closure
        shell: bash
        run: |
          mkdir -p published-evidence
          python -m venv "$RUNNER_TEMP/published-cost"
          "$RUNNER_TEMP/published-cost/bin/python" -m pip install pip==26.2
          installed=false
          for attempt in 1 2 3 4; do
            if "$RUNNER_TEMP/published-cost/bin/python" -m pip install --no-cache-dir \
              --index-url https://pypi.org/simple --report published-evidence/install.json \
              "meridian-plugin-cost==${RELEASE_TAG#v}"; then
              installed=true
              break
            fi
            sleep 15
          done
          test "$installed" = true
          "$RUNNER_TEMP/published-cost/bin/python" -m pip check | tee published-evidence/pip-check.txt
          "$RUNNER_TEMP/published-cost/bin/python" -m pip freeze > published-evidence/runtime.lock
      - name: Verify public package acceptance
        shell: bash
        run: |
          "$RUNNER_TEMP/published-cost/bin/python" -m pip install --no-cache-dir \
            --index-url https://pypi.org/simple --report published-evidence/test-install.json \
            "meridian-plugin-cost[test]==${RELEASE_TAG#v}"
          "$RUNNER_TEMP/published-cost/bin/python" -m pip check
          "$RUNNER_TEMP/published-cost/bin/python" -c 'import meridian_storage.plugins.cost as cost; from pathlib import Path; import sys; assert Path(cost.__file__).is_relative_to(Path(sys.prefix))'
          "$RUNNER_TEMP/published-cost/bin/python" -m pytest --junitxml=published-evidence/tests.xml
      - name: Checksum published acceptance evidence
        if: always()
        working-directory: published-evidence
        run: find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: published-compatibility
          path: published-evidence/
          if-no-files-found: error
