# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "meridian-plugin-cost"
version = "1.0.1"
description = "Meridian V1 immutable rate-card, deterministic pricing, allocation, and cost plugin"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Meridian contributors"}]
keywords = ["meridian", "cost", "rate-card", "pricing", "allocation"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "meridian-plugin-usage==1.0.2",
  "meridian-storage-core==1.0.0",
  "meridian-storage-evidence==1.0.0",
  "meridian-storage-query==1.0.0",
  "meridian-storage-semantics==1.0.0",
]

[project.optional-dependencies]
test = [
  "bandit[toml]==1.9.4",
  "build==1.5.0",
  "cyclonedx-bom==7.3.1",
  "cyclonedx-python-lib[validation]==11.12.0",
  "hatchling==1.32.0",
  "jsonschema==4.26.0",
  "lxml==6.1.2",
  "mypy==2.3.1",
  "packaging==26.3",
  "pip-audit==2.10.1",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.4",
  "twine==7.0.0",
]

[project.urls]
Documentation = "https://github.com/zephytiju/MeridianCostPlugin#readme"
Issues = "https://github.com/zephytiju/MeridianCostPlugin/issues"
Repository = "https://github.com/zephytiju/MeridianCostPlugin"

[project.entry-points."meridian_storage.plugins"]
cost = "meridian_storage.plugins.cost.plugin:CostPluginFactory"

[project.entry-points."meridian_storage.schemas"]
cost = "meridian_storage.plugins.cost.schema:CostSchemaProvider"

[tool.hatch.build.targets.wheel]
packages = ["src/meridian_storage"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/contracts",
  "/docs",
  "/scripts",
  "/.github",
  "/CHANGELOG.md",
  "/CODE_OF_CONDUCT.md",
  "/CONTRIBUTING.md",
  "/LICENSE",
  "/NOTICE",
  "/README.md",
  "/SECURITY.md",
  "/pyproject.toml",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["A", "ARG", "B", "C4", "E", "F", "I", "N", "PERF", "PIE", "PL", "PT", "RUF", "S", "SIM", "T20", "UP", "W"]
ignore = ["PLR0913", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLR2004", "S101"]
"scripts/**/*.py" = ["T201"]
"src/meridian_storage/plugins/cost/errors.py" = ["N818"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["meridian_storage.plugins.cost"]
mypy_path = "src"
warn_unreachable = true

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=meridian_storage.plugins.cost --cov-branch --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]
markers = [
  "conformance: Cost LLD acceptance and deterministic golden tests",
  "contract: released-contract compatibility tests",
  "integration: multi-package integration tests",
  "packaging: distribution and archive tests",
]

[tool.coverage.run]
branch = true
source = ["meridian_storage.plugins.cost"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
  "if TYPE_CHECKING:",
  "raise AssertionError",
  "if __name__ == .__main__.:",
]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]
